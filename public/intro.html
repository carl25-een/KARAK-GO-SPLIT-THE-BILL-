<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Karak Go — Matcha Café</title>
  <meta http-equiv="refresh" content="4;url=/app" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/intro.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍵</text></svg>" />
</head>
<body class="splash">
  <main class="splash-wrap" id="splash" role="link" aria-label="Enter Karak Go — Split the Bill" tabindex="0">
    <div class="splash-pop">
      <div class="splash-icon">🍵</div>
      <div class="splash-name">Karak &amp; Go</div>
      <div class="splash-sub">Matcha Café</div>
    </div>
    <div class="splash-divider" aria-hidden="true"></div>
    <div class="splash-app">Split the Bill</div>
    <div class="splash-hint">Tap to enter</div>
  </main>
  <footer class="splash-foot">Prices in KSh · Karak Go Matcha Café</footer>
  <script>
    (function () {
      var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var done = false;
      function go() {
        if (done) return;
        done = true;
        window.location.replace('/app');
      }
      window.setTimeout(go, reduce ? 700 : 2400);
      document.addEventListener('click', go);
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') go();
      });
    })();
  </script>
</body>
</html>
